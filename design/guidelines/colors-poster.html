<!-- @dsCard group="Colors" viewport="700x150" name="Poster primaries" subtitle="Large flat fields, one accent action" -->
<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--ink)}.lab{font-family:var(--font-condensed);font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:flex;gap:8px"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--poster-red);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Poster red</b><span class="lab" data-hex="--poster-red"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--poster-red-dark);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Red dark</b><span class="lab" data-hex="--poster-red-dark"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--poster-petrol);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Petrol</b><span class="lab" data-hex="--poster-petrol"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--poster-mustard);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Mustard</b><span class="lab" data-hex="--poster-mustard"></span></div></div><script>document.querySelectorAll('[data-hex]').forEach(e=>{const t=document.createElement('i');t.style.color='var('+e.dataset.hex+')';e.parentNode.appendChild(t);const c=getComputedStyle(t).color.match(/\d+/g).map(Number);t.remove();e.textContent=e.dataset.hex+' · #'+c.slice(0,3).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();});</script></body></html>
