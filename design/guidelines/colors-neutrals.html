<!-- @dsCard group="Colors" viewport="700x250" name="Paper & ink — both themes" subtitle="Ground & figure tokens flip in the night edition" -->
<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--ink)}.lab{font-family:var(--font-condensed);font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:8px;padding:10px;background:var(--paper)"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--paper);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Paper</b><span class="lab" data-hex="--paper"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--paper-2);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Paper 2</b><span class="lab" data-hex="--paper-2"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--paper-3);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Paper 3</b><span class="lab" data-hex="--paper-3"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--white);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Raised</b><span class="lab" data-hex="--white"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--ink-3);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Ink 3</b><span class="lab" data-hex="--ink-3"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--ink);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Ink</b><span class="lab" data-hex="--ink"></span></div></div><div data-theme="night" style="display:flex;gap:8px;padding:10px;background:var(--paper)"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--paper);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Paper</b><span class="lab" data-hex="--paper"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--paper-2);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Paper 2</b><span class="lab" data-hex="--paper-2"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--paper-3);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Paper 3</b><span class="lab" data-hex="--paper-3"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--white);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Raised</b><span class="lab" data-hex="--white"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--ink-3);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Ink 3</b><span class="lab" data-hex="--ink-3"></span></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px"><div style="height:54px;background:var(--ink);border:1px solid var(--paper-3)"></div><b style="font-size:12px">Ink</b><span class="lab" data-hex="--ink"></span></div></div></div><script>document.querySelectorAll('[data-hex]').forEach(e=>{const t=document.createElement('i');t.style.color='var('+e.dataset.hex+')';e.parentNode.appendChild(t);const c=getComputedStyle(t).color.match(/\d+/g).map(Number);t.remove();e.textContent=e.dataset.hex+' · #'+c.slice(0,3).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();});</script></body></html>
