<!-- @dsCard group="Colors" viewport="700x250" name="Line palette — brand only" subtitle="Decoration only; never encodes data. Night: ≥3:1 vs ground" -->
<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--ink)}.lab{font-family:var(--font-condensed);font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:flex;flex-direction:column;gap:8px"><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:14px;background:var(--paper)"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-vermilion)"></div><div style="height:10px;background:var(--line-vermilion)"></div><b style="font-size:12px">vermilion</b><span class="lab" data-cr="--line-vermilion"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-orange)"></div><div style="height:10px;background:var(--line-orange)"></div><b style="font-size:12px">orange</b><span class="lab" data-cr="--line-orange"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-yellow)"></div><div style="height:10px;background:var(--line-yellow)"></div><b style="font-size:12px">yellow</b><span class="lab" data-cr="--line-yellow"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-green)"></div><div style="height:10px;background:var(--line-green)"></div><b style="font-size:12px">green</b><span class="lab" data-cr="--line-green"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-sky)"></div><div style="height:10px;background:var(--line-sky)"></div><b style="font-size:12px">sky</b><span class="lab" data-cr="--line-sky"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-blue)"></div><div style="height:10px;background:var(--line-blue)"></div><b style="font-size:12px">blue</b><span class="lab" data-cr="--line-blue"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-violet)"></div><div style="height:10px;background:var(--line-violet)"></div><b style="font-size:12px">violet</b><span class="lab" data-cr="--line-violet"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-black)"></div><div style="height:10px;background:var(--line-black)"></div><b style="font-size:12px">black</b><span class="lab" data-cr="--line-black"></span></div></div><div data-theme="night"><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;padding:14px;background:var(--paper)"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-vermilion)"></div><div style="height:10px;background:var(--line-vermilion)"></div><b style="font-size:12px">vermilion</b><span class="lab" data-cr="--line-vermilion"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-orange)"></div><div style="height:10px;background:var(--line-orange)"></div><b style="font-size:12px">orange</b><span class="lab" data-cr="--line-orange"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-yellow)"></div><div style="height:10px;background:var(--line-yellow)"></div><b style="font-size:12px">yellow</b><span class="lab" data-cr="--line-yellow"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-green)"></div><div style="height:10px;background:var(--line-green)"></div><b style="font-size:12px">green</b><span class="lab" data-cr="--line-green"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-sky)"></div><div style="height:10px;background:var(--line-sky)"></div><b style="font-size:12px">sky</b><span class="lab" data-cr="--line-sky"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-blue)"></div><div style="height:10px;background:var(--line-blue)"></div><b style="font-size:12px">blue</b><span class="lab" data-cr="--line-blue"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-violet)"></div><div style="height:10px;background:var(--line-violet)"></div><b style="font-size:12px">violet</b><span class="lab" data-cr="--line-violet"></span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:10px;background:var(--line-black)"></div><div style="height:10px;background:var(--line-black)"></div><b style="font-size:12px">black</b><span class="lab" data-cr="--line-black"></span></div></div></div></div><script>function lumOf(c){const m=c.match(/[\d.]+/g).map(Number);const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(m[0])+.7152*f(m[1])+.0722*f(m[2]);}
function cr(a,b){const x=lumOf(a),y=lumOf(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}document.querySelectorAll('[data-cr]').forEach(e=>{const box=e.closest('[style*="grid"]');const bg=getComputedStyle(box).backgroundColor;const t=document.createElement('i');t.style.color='var('+e.dataset.cr+')';box.appendChild(t);const c=getComputedStyle(t).color;t.remove();const r=cr(c,bg);e.textContent=r.toFixed(1)+':1'+(box.closest('[data-theme]')?(r>=3?' ✓':' ✗'):'');});</script></body></html>
