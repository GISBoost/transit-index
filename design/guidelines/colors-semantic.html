<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--ink)}.lab{font-family:var(--font-condensed);font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:flex;gap:8px"><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:50px;background:var(--success)"></div><b style="font-size:12px">Success</b><span class="lab">--success</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:50px;background:var(--warning)"></div><b style="font-size:12px">Warning</b><span class="lab">--warning</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:50px;background:var(--danger)"></div><b style="font-size:12px">Danger</b><span class="lab">--danger</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:50px;background:var(--info)"></div><b style="font-size:12px">Info</b><span class="lab">--info</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:50px;background:var(--accent)"></div><b style="font-size:12px">Accent</b><span class="lab">--accent</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:50px;background:var(--focus-ring)"></div><b style="font-size:12px">Focus</b><span class="lab">--focus-ring</span></div><div style="flex:1;display:flex;flex-direction:column;gap:5px"><div style="height:50px;background:var(--surface-sign)"></div><b style="font-size:12px">Sign</b><span class="lab">--surface-sign</span></div></div></body></html>
