<!-- @dsCard group="Type" viewport="700x230" name="Numerals — tabular check" subtitle="All data numerals use tabular-nums; verified live" -->
<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--ink)}.lab{font-family:var(--font-condensed);font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:flex;gap:28px;align-items:flex-start"><div style="font:700 44px/1.05 var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:-0.02em"><div>11,1 km/h</div><div>20,8 km/h</div><div>17,6 km/h</div></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;font-size:13px"><div id="tn"></div><div id="pn" class="lab"></div><div style="font:400 16px/1.4 var(--font-sans);font-variant-numeric:tabular-nums">0123456789 · −22% · 41 200 · 3,8 mln</div><div style="font:400 16px/1.4 var(--font-condensed);font-variant-numeric:tabular-nums">Cn: 0123456789 · 05:40–23:10</div></div></div><script>document.fonts.ready.then(()=>{const m=(f,v)=>{const c=document.createElement('canvas').getContext('2d');const s=document.createElement('span');s.style.cssText='position:absolute;visibility:hidden;font:'+f+';font-variant-numeric:'+v;document.body.appendChild(s);const w=[...'0123456789'].map(d=>{s.textContent=d.repeat(10);return s.getBoundingClientRect().width/10;});s.remove();return w;};const t=m('700 44px '+getComputedStyle(document.body).getPropertyValue('--font-sans'),'tabular-nums');const spread=Math.max(...t)-Math.min(...t);document.getElementById('tn').innerHTML=(spread<0.05?'<b>✓ Tabular</b>':'<b>✗ Not tabular</b>')+' — digit widths 0–9 at 44px: '+t.map(x=>x.toFixed(1)).join(' / ');const p=m('700 44px '+getComputedStyle(document.body).getPropertyValue('--font-sans'),'proportional-nums');document.getElementById('pn').textContent='proportional-nums spread for comparison: '+(Math.max(...p)-Math.min(...p)).toFixed(1)+'px';});</script></body></html>
