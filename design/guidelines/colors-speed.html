<!-- @dsCard group="Colors" viewport="700x290" name="Speed scale — data only" subtitle="Sequential, 5 classes, not red–green, ≥3:1 vs map base" -->
<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--ink)}.lab{font-family:var(--font-condensed);font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:flex;flex-direction:column;gap:8px"><div  style="background:var(--map-base);padding:12px 14px;display:flex;flex-direction:column;gap:8px"><div style="display:grid;grid-template-columns:repeat(5,1fr) 70px 70px;gap:6px;align-items:end"><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-1)"></div><span class="lab" style="color:var(--ink)">--speed-1</span><span class="lab" data-scr="--speed-1"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-2)"></div><span class="lab" style="color:var(--ink)">--speed-2</span><span class="lab" data-scr="--speed-2"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-3)"></div><span class="lab" style="color:var(--ink)">--speed-3</span><span class="lab" data-scr="--speed-3"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-4)"></div><span class="lab" style="color:var(--ink)">--speed-4</span><span class="lab" data-scr="--speed-4"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-5)"></div><span class="lab" style="color:var(--ink)">--speed-5</span><span class="lab" data-scr="--speed-5"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-nodata)"></div><span class="lab" style="color:var(--ink)">no data</span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:repeating-linear-gradient(135deg,var(--speed-3) 0 3px,var(--map-base) 3px 6px)"></div><span class="lab" style="color:var(--ink)">thin</span></div></div><div style="display:flex;height:8px;filter:grayscale(1)"><div style="flex:1;background:var(--speed-1)"></div><div style="flex:1;background:var(--speed-2)"></div><div style="flex:1;background:var(--speed-3)"></div><div style="flex:1;background:var(--speed-4)"></div><div style="flex:1;background:var(--speed-5)"></div></div><span class="lab" style="color:var(--ink)">↑ greyscale check · light: slow = darkest</span></div><div data-theme="night" style="background:var(--map-base);padding:12px 14px;display:flex;flex-direction:column;gap:8px"><div style="display:grid;grid-template-columns:repeat(5,1fr) 70px 70px;gap:6px;align-items:end"><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-1)"></div><span class="lab" style="color:var(--ink)">--speed-1</span><span class="lab" data-scr="--speed-1"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-2)"></div><span class="lab" style="color:var(--ink)">--speed-2</span><span class="lab" data-scr="--speed-2"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-3)"></div><span class="lab" style="color:var(--ink)">--speed-3</span><span class="lab" data-scr="--speed-3"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-4)"></div><span class="lab" style="color:var(--ink)">--speed-4</span><span class="lab" data-scr="--speed-4"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-5)"></div><span class="lab" style="color:var(--ink)">--speed-5</span><span class="lab" data-scr="--speed-5"></span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:var(--speed-nodata)"></div><span class="lab" style="color:var(--ink)">no data</span></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:8px;background:repeating-linear-gradient(135deg,var(--speed-3) 0 3px,var(--map-base) 3px 6px)"></div><span class="lab" style="color:var(--ink)">thin</span></div></div><div style="display:flex;height:8px;filter:grayscale(1)"><div style="flex:1;background:var(--speed-1)"></div><div style="flex:1;background:var(--speed-2)"></div><div style="flex:1;background:var(--speed-3)"></div><div style="flex:1;background:var(--speed-4)"></div><div style="flex:1;background:var(--speed-5)"></div></div><span class="lab" style="color:var(--ink)">↑ greyscale check · night: slow = brightest</span></div></div><script>function lumOf(c){const m=c.match(/[\d.]+/g).map(Number);const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(m[0])+.7152*f(m[1])+.0722*f(m[2]);}
function cr(a,b){const x=lumOf(a),y=lumOf(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}document.querySelectorAll('[data-scr]').forEach(e=>{const box=e.closest('[style*="map-base"]');const bg=getComputedStyle(box).backgroundColor;const t=document.createElement('i');t.style.color='var('+e.dataset.scr+')';box.appendChild(t);const c=getComputedStyle(t).color;t.remove();const r=cr(c,bg);e.textContent=r.toFixed(1)+':1 '+(r>=3?'✓':'✗');});</script></body></html>
