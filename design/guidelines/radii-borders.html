<!doctype html><html lang="pl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);color:var(--ink)}.lab{font-family:var(--font-condensed);font-size:12px;color:var(--ink-3)}</style></head><body><div style="display:flex;gap:20px"><div style="display:flex;flex-direction:column;gap:8px"><div style="width:100px;height:84px;box-sizing:border-box;border:2px solid var(--ink);background:var(--white)"></div><span class="lab">radius-0 · 2px</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:100px;height:84px;box-sizing:border-box;border-top:8px solid var(--ink);background:var(--paper-2)"></div><span class="lab">rule-w 8px</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:100px;height:84px;box-sizing:border-box;background:var(--ink);border-radius:12px"></div><span class="lab">radius-sign 12px</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:100px;height:84px;box-sizing:border-box;background:var(--line-blue);border-radius:50%;width:84px"></div><span class="lab">pill (bullets)</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="width:100px;height:84px;box-sizing:border-box;border:1px solid var(--border-subtle);background:var(--white)"></div><span class="lab">hairline 1px</span></div></div></body></html>
