<!-- @dsCard group="Dane" height=1500 subtitle="Ranking miast: wiersz z łącznikiem, przełączniki, stany, tabela linii" -->
<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet"></head>
<body class="idx-pv">
<div class="idx-stack idx-wrap">
<div class="idx-row"><span class="idx-ph">dane zastępcze</span><span class="idx-caption idx-mute">Wartości i stany jakości są przykładowe.</span></div>
<div id="rank-main"></div>
<div class="idx-grid idx-grid--2"><div><div class="idx-cap">Wczytywanie</div><div id="rank-load"></div></div><div><div class="idx-cap">Brak danych</div><div id="rank-empty"></div></div></div>
<div><div class="idx-cap">Błąd</div><div id="rank-err" class="idx-read"></div></div>
<div class="idx-frame" style="width:390px;max-width:100%"><div class="idx-cap">Wąski ekran (390 px)</div><div id="rank-narrow"></div></div>
<div><div class="idx-cap">Tabela linii: ta sama gramatyka</div><div id="lines"></div></div></div>
<script>
(function () {
  var D = window.IDX; if (!D) return;

  var rows = [
    { c: 'Warszawa', v: 19.4, q: 'ranked', l: 'w rankingu' },
    { c: 'Rzeszów', v: 18.1, q: 'ranked', l: 'w rankingu' },
    { c: 'Łódź', v: 17.8, q: 'ranked', l: 'w rankingu' },
    { c: 'Kielce', v: 15.2, q: 'limited', l: 'ograniczone' },
    { c: 'Miasto E', v: null, q: 'out', l: 'poza rankingiem' }
  ];
  function row(r, i, n, mod) {
    var cls = 'idx-conn' + (i === 0 ? ' idx-conn--first' : '') + (i === n - 1 ? ' idx-conn--last' : '');
    var out = r.v == null, k = out ? 0 : Math.min(r.v / 30, 1), sc = out ? 'nd' : D.speedClass(r.v);
    return '<a class="idx-rrow' + (out ? ' idx-rrow--out' : '') + (mod || '') + '" href="#"><span class="' + cls + '"><i class="idx-node idx-node--sm' + (i === 0 ? ' idx-node--solid' : '') + '"></i></span>' +
      '<span class="idx-rrow__rank idx-board">' + (out ? '–' : (i + 1)) + '</span>' +
      '<span class="idx-rrow__name"><span class="idx-rrow__city">' + r.c + '</span><span class="idx-q idx-q--' + r.q + '"><i class="idx-node idx-node--sm"></i>' + r.l + '</span></span>' +
      (out ? '<span class="idx-bar idx-bar--nd idx-hatch" aria-label="brak danych"></span>' : '<span class="idx-bar"><span class="idx-bar__fill idx-s' + sc + '" data-k="' + k.toFixed(3) + '"></span></span>') +
      '<span class="idx-rrow__val idx-figure-md">' + (out ? '—' : D.num(r.v)) + '<small>km/h</small></span></a>';
  }
  function seg(label, opts, sel) {
    return '<div><span class="idx-cap idx-seg-label">' + label + '</span><div class="idx-seg" role="radiogroup" aria-label="' + label + '">' + opts.map(function (t, i) { return '<button type="button" role="radio" aria-checked="' + (i === sel) + '" class="idx-seg__opt">' + t + '</button>'; }).join('') + '</div></div>';
  }
  function card(rowsHtml, mod) {
    return '<div class="idx-rank">' + '<div class="idx-rank__head">' + seg('Rodzaj', ['Tramwaje', 'Autobusy'], 0) + seg('Pora', ['Dzień', 'Szczyt', 'Poza szczytem'], 0) + '</div>' + rowsHtml + '<p class="idx-rank__foot idx-caption">Zmierzone (rekonstrukcja z GTFS-RT), mediana prędkości segmentowej. Kolor słupka: klasa prędkości.</p></div>';
  }
  var main = rows.map(function (r, i) { return row(r, i, rows.length, i === 1 ? ' is-hover' : (i === 2 ? ' is-focus' : '')); }).join('');
  document.getElementById('rank-main').innerHTML = card(main);
  function skel(n) { var s = ''; for (var i = 0; i < n; i++) s += '<div class="idx-rrow" aria-hidden="true"><span class="idx-conn' + (i === 0 ? ' idx-conn--first' : '') + (i === n - 1 ? ' idx-conn--last' : '') + '"><i class="idx-node idx-node--sm"></i></span><span class="idx-skel" style="height:12px;width:24px;grid-area:rank"></span><span class="idx-skel" style="height:16px;width:60%;grid-area:name"></span><span class="idx-skel" style="height:6px;grid-area:bar"></span><span class="idx-skel" style="height:20px;width:64px;justify-self:end;grid-area:val"></span></div>'; return s; }
  document.getElementById('rank-load').innerHTML = '<div class="idx-rank" aria-busy="true"><div class="idx-rank__head"><span class="idx-loader" role="status" aria-label="Ładowanie rankingu"><i class="idx-node"></i><i class="idx-node"></i><i class="idx-node"></i><i class="idx-node"></i></span></div>' + skel(3) + '</div>';
  document.getElementById('rank-empty').innerHTML = '<div class="idx-rank"><div class="idx-rank__head"><span class="idx-ui-strong">Autobusy · Poza szczytem</span></div><div style="padding:var(--idx-space-6) var(--idx-space-5)" class="idx-state"><span data-icon="info" data-size="20"></span><div><p class="idx-ui-strong" style="color:var(--ink)">Brak miast do porównania.</p><p class="idx-ui">Dla tego wyboru żadne miasto nie ma dostatecznej próby (n ≥ XX). Zmień porę lub rodzaj.</p></div></div></div>';
  document.getElementById('rank-err').innerHTML = '<div class="idx-rank" role="alert" style="border:1.5px solid var(--ink)"><div style="padding:var(--idx-space-6) var(--idx-space-5)" class="idx-state idx-state--error"><span data-icon="warning" data-size="20"></span><div><p class="idx-ui-strong">Nie udało się wczytać rankingu.</p><p class="idx-ui idx-mute" style="margin:var(--idx-space-1) 0 var(--idx-space-4)">Dane nie odpowiedziały. Spróbuj ponownie za chwilę.</p><button class="idx-btn idx-btn--secondary" type="button">Spróbuj ponownie</button></div></div></div>';
  var lines = [['11','XX,X','XX,X','XX'], ['XX','XX,X','XX,X','XX'], ['XX','XX,X','XX,X','XX']];
  document.getElementById('lines').innerHTML = '<div class="idx-rank"><div class="idx-table-scroll"><table class="idx-table"><caption>Linie miasta, zmierzone, dane zastępcze</caption><thead><tr><th scope="col">Linia</th><th scope="col" class="is-num">Zmierzone, km/h</th><th scope="col" class="is-num">Rozkładowe, km/h</th><th scope="col" class="is-num">n</th></tr></thead><tbody>' + lines.map(function (l) { return '<tr><td>' + (l[0] === 'XX' ? '<span class="idx-badge idx-badge--ph">XX</span>' : '<span class="idx-badge">' + l[0] + '</span>') + '</td><td class="is-num">' + l[1] + '</td><td class="is-num">' + l[2] + '</td><td class="is-num">' + l[3] + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  Array.prototype.forEach.call(document.querySelectorAll('.idx-seg'), function (g) { g.addEventListener('click', function (e) { var b = e.target.closest('.idx-seg__opt'); if (!b) return; Array.prototype.forEach.call(g.children, function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); }); }); });

  document.getElementById('rank-narrow').innerHTML = card(rows.map(function (r, i) { return row(r, i, rows.length); }).join(''));
  Array.prototype.forEach.call(document.querySelectorAll('.idx-seg'), function (g) { g.addEventListener('click', function (e) { var b = e.target.closest('.idx-seg__opt'); if (!b) return; Array.prototype.forEach.call(g.children, function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); }); }); });

  D.hydrate(); D.motion();
})();
</script>
</body></html>
