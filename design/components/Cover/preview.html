<!-- @dsCard height=340 -->
<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=IBM+Plex+Sans:wght@400&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: var(--bg); }
  .cv { position: relative; width: 960px; height: 340px; overflow: hidden; background: var(--bg); }
  .cv svg { position: absolute; left: 0; top: 0; width: 960px; height: 340px; display: block; }
  .cv .b1 { fill: var(--idx-blue-950); }
  .cv .b2 { fill: var(--idx-blue-600); }
  .cv .b3 { fill: var(--idx-blue-400); }
  .cv .b4 { fill: var(--idx-blue-200); }
  .cv .b5 { fill: var(--amber); }
  .cv .b6 { fill: var(--idx-blue-800); }
  :root[data-theme="dark"] .cv .b1 { fill: var(--idx-blue-700); }
  :root[data-theme="dark"] .cv .b2 { fill: var(--idx-blue-400); }
  :root[data-theme="dark"] .cv .b3 { fill: var(--idx-blue-300); }
  :root[data-theme="dark"] .cv .b4 { fill: var(--idx-blue-100); }
  .cv .ln { stroke: var(--bg); stroke-width: var(--idx-line-track); }
  .cv .nd { fill: none; stroke: var(--bg); stroke-width: 2; }
  .cv .ns { fill: var(--bg); stroke: var(--bg); stroke-width: 2; }
  .cv .txt { position: absolute; left: 32px; bottom: 32px; }
  .cv h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 0.95; letter-spacing: -0.035em; color: var(--ink); }
  .cv p { margin: 12px 0 0; font-family: var(--font-sans); font-size: 14px; line-height: 1.4; color: var(--ink-muted); }
</style></head>
<body>
<div class="cv">
<svg viewBox="0 0 960 340" role="img" aria-label="Okładka: paski koloru i linia z przystankami">
<!--
  blocks: idx-blue-950 x260, idx-accent (blue-600) x210, blue-400 x130, blue-200 x120, amber x60, blue-800 x180; band 112 high (idx-space-9 + idx-space-4), flush to top and both edges.
  arrangement: strip of unequal bands bleeding off the top and sides; amber is the single small signal block, as the service uses amber only for slow and warnings.
  pattern: literal motif, the line-and-stop element. One 2px line (idx-line-track) through the band in the ground colour with hollow nodes cut out of the blocks at a 64px pitch (idx-space-8), one solid stop.
  steps and radii: pitch idx-space-8 (64), node r=5 (idx-node-md 10px), line 2px; corners square, the bands are the system's strip, not cards.
-->
<rect class="b1" x="0" y="0" width="260" height="112"/>
<rect class="b2" x="260" y="0" width="210" height="112"/>
<rect class="b3" x="470" y="0" width="130" height="112"/>
<rect class="b4" x="600" y="0" width="120" height="112"/>
<rect class="b5" x="720" y="0" width="60" height="112"/>
<rect class="b6" x="780" y="0" width="180" height="112"/>
<line class="ln" x1="0" y1="56" x2="960" y2="56"/>
<circle class="nd" cx="32" cy="56" r="5"/>
<circle class="nd" cx="96" cy="56" r="5"/>
<circle class="nd" cx="160" cy="56" r="5"/>
<circle class="nd" cx="224" cy="56" r="5"/>
<circle class="ns" cx="288" cy="56" r="5"/>
<circle class="nd" cx="352" cy="56" r="5"/>
<circle class="nd" cx="416" cy="56" r="5"/>
<circle class="nd" cx="480" cy="56" r="5"/>
<circle class="nd" cx="544" cy="56" r="5"/>
<circle class="nd" cx="608" cy="56" r="5"/>
<circle class="nd" cx="672" cy="56" r="5"/>
<circle class="nd" cx="736" cy="56" r="5"/>
<circle class="nd" cx="800" cy="56" r="5"/>
<circle class="nd" cx="864" cy="56" r="5"/>
<circle class="nd" cx="928" cy="56" r="5"/>
</svg>
<div class="txt">
<h1>Indeks prędkości<br>transportu publicznego</h1>
<p>Ranking miast według prędkości odtworzonej z danych GTFS-RT.</p>
</div>
</div>
</body></html>
