<!-- @dsCard group="Motyw" height=560 subtitle="Zestaw ikon liniowych, kreska 1,5 px" -->
<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet"></head>
<body class="idx-pv">
<div class="idx-stack"><div class="idx-grid idx-grid--3" id="ig" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"></div>
<p class="idx-caption idx-mute idx-read">Jeden zestaw liniowy: siatka 24 px, kreska 1,5 px (idx-line-icon), zakończenia i łączenia okrągłe, bez wypełnień, bez emoji. Kolor dziedziczy currentColor. Rozmiary 16, 20, 24 px. IDX.icon(nazwa, rozmiar).</p></div>
<script>
(function () {
  var D = window.IDX; if (!D) return;

  var g = document.getElementById('ig');
  g.innerHTML = D.demo.icons.map(function (n) { return '<div class="idx-card" style="padding:var(--idx-space-4);display:grid;gap:var(--idx-space-3);justify-items:start"><span style="color:var(--ink);display:flex;gap:var(--idx-space-4);align-items:center">' + D.icon(n, 24) + D.icon(n, 20) + D.icon(n, 16) + '</span><span class="idx-label idx-mute">' + n + '</span></div>'; }).join('');

  D.hydrate(); D.motion();
})();
</script>
</body></html>
