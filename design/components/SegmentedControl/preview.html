<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet"></head>
<body class="idx-pv">
<div class="idx-stack"><div class="idx-row" style="gap:var(--idx-space-6);align-items:flex-start">
<div><span class="idx-cap idx-seg-label">Rodzaj</span><div class="idx-seg" role="radiogroup" aria-label="Rodzaj"><button type="button" role="radio" aria-checked="true" class="idx-seg__opt">Tramwaje</button><button type="button" role="radio" aria-checked="false" class="idx-seg__opt">Autobusy</button></div></div>
<div><span class="idx-cap idx-seg-label">Pora</span><div class="idx-seg" role="radiogroup" aria-label="Pora"><button type="button" role="radio" aria-checked="false" class="idx-seg__opt">Dzień</button><button type="button" role="radio" aria-checked="true" class="idx-seg__opt">Szczyt</button><button type="button" role="radio" aria-checked="false" class="idx-seg__opt">Poza szczytem</button></div></div>
<div><span class="idx-cap idx-seg-label">Percentyl</span><div class="idx-seg" role="radiogroup" aria-label="Percentyl"><button type="button" role="radio" aria-checked="false" class="idx-seg__opt">P15</button><button type="button" role="radio" aria-checked="true" class="idx-seg__opt">P50</button><button type="button" role="radio" aria-checked="false" class="idx-seg__opt">P85</button></div></div></div>
<div class="idx-row" style="gap:var(--idx-space-6);align-items:flex-start">
<div><span class="idx-cap idx-seg-label">Najechanie na „Autobusy”</span><div class="idx-seg" role="radiogroup" aria-label="Najechanie na „Autobusy”"><button type="button" role="radio" aria-checked="true" class="idx-seg__opt">Tramwaje</button><button type="button" role="radio" aria-checked="false" class="idx-seg__opt is-hover">Autobusy</button></div></div>
<div><span class="idx-cap idx-seg-label">Fokus na „Szczyt”</span><div class="idx-seg" role="radiogroup" aria-label="Fokus na „Szczyt”"><button type="button" role="radio" aria-checked="true" class="idx-seg__opt">Dzień</button><button type="button" role="radio" aria-checked="false" class="idx-seg__opt is-focus">Szczyt</button><button type="button" role="radio" aria-checked="false" class="idx-seg__opt">Poza szczytem</button></div></div></div>
<p class="idx-caption idx-mute idx-read">Zaznaczenie: tło accent-soft, tekst accent-ink, waga 600. Obrys idx-control-edge (3:1). Strzałki przełączają opcje wewnątrz grupy (radiogroup).</p></div>
<script>
(function () {
  var D = window.IDX; if (!D) return;

  Array.prototype.forEach.call(document.querySelectorAll('.idx-seg'), function (g) {
    g.addEventListener('click', function (e) { var b = e.target.closest('.idx-seg__opt'); if (!b) return; Array.prototype.forEach.call(g.children, function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); }); });
    g.addEventListener('keydown', function (e) { var k = e.key; if (k !== 'ArrowRight' && k !== 'ArrowLeft') return; var o = Array.prototype.slice.call(g.children), i = o.findIndex(function (x) { return x.getAttribute('aria-checked') === 'true'; }); i = (i + (k === 'ArrowRight' ? 1 : -1) + o.length) % o.length; o[i].click(); o[i].focus(); e.preventDefault(); });
  });
  D.hydrate(); D.motion();
})();
</script>
</body></html>
