<!-- @dsCard group="Dane" height=1000 subtitle="Profil godzinowy: rozkładowe (linia przerywana) i zmierzone, bezpośrednie podpisy" -->
<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet"></head>
<body class="idx-pv">
<div class="idx-stack idx-wrap"><div class="idx-row"><span class="idx-ph">dane zastępcze</span><span class="idx-caption idx-mute">Krzywe są przykładowe.</span></div>
<figure class="idx-card idx-chart"><figcaption class="idx-display-sm" style="margin-bottom:var(--idx-space-4)">Prędkość w ciągu doby<span class="idx-body idx-mute" style="display:block;font-weight:400;font-size:15px;letter-spacing:0">Rozkładowe kontra zmierzone (rekonstrukcja z GTFS-RT), km/h</span></figcaption><div id="hp"></div>
<p class="idx-caption idx-mute" style="margin-top:var(--idx-space-3)">Kreskowane godziny: za mało danych (n &lt; XX), nie zero. Oś zaczyna się od 0.</p></figure>
<figure class="idx-card idx-chart"><figcaption class="idx-cap" style="margin:0 0 var(--idx-space-3)">Próba niepełna wieczorem: dwa zakresy „za mało danych”</figcaption><div id="hp2"></div></figure>
<div class="idx-grid idx-grid--2"><div class="idx-card" aria-busy="true"><p class="idx-cap">Wczytywanie</p><span class="idx-skel" style="height:140px"></span></div>
<div class="idx-card"><p class="idx-cap">Brak danych</p><div class="idx-hatch" style="height:140px;border:1px dashed var(--idx-chart-nodata);display:grid;place-items:center"><span class="idx-ui idx-mute" style="background:var(--surface);padding:0 var(--idx-space-2)">Za mało danych, żeby narysować profil.</span></div></div></div></div>
<script>
(function () {
  var D = window.IDX; if (!D) return;

  var plan = [], meas = [], i;
  for (i = 0; i < 24; i++) { var p = 22 - 3 * Math.exp(-Math.pow(i - 8, 2) / 6) - 4 * Math.exp(-Math.pow(i - 16.5, 2) / 7); plan.push(+p.toFixed(1)); }
  for (i = 0; i < 24; i++) { meas.push(i < 4 ? null : +(plan[i] - 1.2 - 2.6 * Math.exp(-Math.pow(i - 8, 2) / 5) - 3.1 * Math.exp(-Math.pow(i - 16.5, 2) / 6)).toFixed(1)); }
  D.chart.hourly(document.getElementById('hp'), { plan: plan, meas: meas, ymax: 30 });
  D.chart.hourly(document.getElementById('hp2'), { plan: plan, meas: meas.map(function (v, k) { return k > 19 ? null : v; }), ymax: 30, title: 'Profil godzinowy, próba niepełna wieczorem' });

  D.hydrate(); D.motion();
})();
</script>
</body></html>
