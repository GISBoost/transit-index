<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@300;400;600&amp;display=swap" rel="stylesheet"></head>
<body class="idx-pv">
<div class="idx-stack">
<div class="idx-grid idx-grid--3">
<div><div class="idx-cap">Główny</div><div class="idx-stack" style="display:grid;gap:var(--idx-space-3);justify-items:start">
<button type="button" class="idx-btn idx-btn--primary ">Zobacz ranking</button>
<button type="button" class="idx-btn idx-btn--primary is-hover">Najechanie</button>
<button type="button" class="idx-btn idx-btn--primary is-focus">Fokus</button>
<button type="button" class="idx-btn idx-btn--primary is-press">Wciśnięty</button>
<button type="button" class="idx-btn idx-btn--primary" aria-busy="true"><span class="idx-loader idx-loader--sm" role="status" aria-label="Ładowanie"><i class="idx-node idx-node--sm"></i><i class="idx-node idx-node--sm"></i><i class="idx-node idx-node--sm"></i></span>Wczytuję</button>
<button type="button" class="idx-btn idx-btn--primary" disabled>Niedostępny</button></div></div>
<div><div class="idx-cap">Drugoplanowy</div><div style="display:grid;gap:var(--idx-space-3);justify-items:start">
<button type="button" class="idx-btn idx-btn--secondary ">Pobierz dane</button>

<button type="button" class="idx-btn idx-btn--secondary is-focus">Fokus</button>
<button type="button" class="idx-btn idx-btn--secondary" disabled>Niedostępny</button></div></div>
<div><div class="idx-cap">Tekstowy</div><div style="display:grid;gap:var(--idx-space-3);justify-items:start">

<button type="button" class="idx-btn idx-btn--text is-hover">Najechanie <span data-icon="arrow-right" data-size="18"></span></button>
<button type="button" class="idx-btn idx-btn--text is-focus">Fokus <span data-icon="arrow-right" data-size="18"></span></button></div></div></div>
<p class="idx-caption idx-mute idx-read">Jeden przycisk główny na widok. Promień 6 px, wysokość co najmniej 44 px, bez pigułek i cieni. Wciśnięcie: skala 0,97 i idx-accent-press.</p></div>
<script>
(function () {

  D.hydrate(); D.motion();
})();
</script>
