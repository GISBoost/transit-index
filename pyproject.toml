[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-index"
version = "0.0.0"
description = "Transit Index: quality index of public transport from reconstructed GTFS-RT data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "pyyaml",
    "jsonschema",
    "holidays",
    "geopandas",
    "shapely",
]

[project.optional-dependencies]
dev = ["pytest"]
tiles = ["pmtiles", "mapbox-vector-tile"]   # M4: tile acceptance check (tippecanoe itself is a system tool)

[project.scripts]
ti = "ti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs access to GitHub release assets (downloads into data/raw, gitignored)"]
