[project]
name = "transit-index"
version = "0.0.0"
description = "Transit Index: quality index of public transport from reconstructed GTFS-RT data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "pyyaml",
    "jsonschema",
    "holidays",
    "geopandas",
    "shapely",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs access to GitHub release assets (downloads into data/raw, gitignored)"]
