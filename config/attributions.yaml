# Per-city source attributions for edition manifests (docs/05 §3, docs/licenses.md §2, §6; ADR-0003).
# Source of every value: docs/licenses.md (preliminary audit 2026-09-26, NOT a legal opinion). A value that the
# audit did not establish is null with verified: false - never guessed. `ti gate` copies these into
# manifest.json (`attributions` per city) together with the retrieval dates it measures itself.
# Results are CC BY 4.0 (D7, ADR-0003). `processing_note` is the "dane przetworzone" sentence required by
# several operators (docs/licenses.md §3.4).
license: CC-BY-4.0
processing_note: "Dane przetworzone przez Transit Index (rekonstrukcja przejazdów z pozycji pojazdów GTFS-RT i rozkładu GTFS, agregacja do wskaźników); nie są danymi operatora."
osm_attribution: "(c) OpenStreetMap contributors (ODbL)"
