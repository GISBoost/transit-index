# The only place for numbers (CLAUDE.md: no magic numbers). Spec: docs/03-metrics-spec.md.
# Values marked [PROPOSAL] are backed by data but need confirmation on the full window (M2/M3).
method_version: "ti-1.0-draft"

# 5 classes = --speed-1..5 tokens in design/. Class i (0-based) -> --speed-{i+1}.
# Kept as-is (T18, M2, 2026-09-27): NOT a clean pass - 4 of 16 cities exceed 35%/fall under 8% in
# one class, but 3 of those 4 already have a registered feed defect (city_defects.yaml) that
# plausibly explains the skew; a shared, comparable edge set can't fit every city's profile
# anyway. See docs/adr/0006-w10-w11-w12-final-definitions.md for the full table and reasoning.
speed_classes_kmh: [15, 20, 25, 30]

# Local city hours (obs_local; hour h = h:00-h+1:00). Only hour 6 belongs to all_day alone. Issue #5: 07-09 / 09-14 / 14-18 / 18-22.
# L0 stores `band` from ingest time; `aggregate.apply_config_bands` re-derives it from `hour` with THIS table on load.
bands:
  am_peak: [7, 8]
  midday: [9, 10, 11, 12, 13]
  pm_peak: [14, 15, 16, 17]
  evening: [18, 19, 20, 21]
band_min_recorded_share: 0.90        # a city has a band if the recording covers >= 90% of its hours

area:
  require_polygon: true              # radius fallback is for internal tests only, never published

segment_min:
  ok:   {n_obs: 10, n_days: 5}
  thin: {n_obs: 3}

# W3 peak penalty
peak_penalty: {ref_bands: [midday, evening], min_obs_per_segment: 10}

# W10 punctuality (thresholds from transit_charts C11). Confirmed by T15 (M2): rho >= 0.95 for
# rankings built with late_s in {120, 300} vs the 180 baseline, so the exact threshold doesn't matter.
punctuality: {on_time_s: [-60, 180], late_s: 600, exclude_first_stop: true}

# W11 regularity (EWT). frequent_headway_s confirmed by T16 (M2): rho >= 0.96 vs 480s/720s
# variants and vs the median-of-cells aggregation variant, so 600s + pooled Sigma-Sigma stand.
# min_headways_per_cell stays null: no per-cell floor was needed to get that robustness.
regularity: {frequent_headway_s: 600, min_headways_per_cell: null}

# W12 service (scheduled departures per hour per stop). Source = same-day static (R10), median
# per stop confirmed robust for bus (T16/M2: rho >= 0.94 vs share-of-stops variants) but NOT for
# tram (rho = -0.16) - median stays the published number, tram ranking flagged as method-uncertain.
# See docs/adr/0006-w10-w11-w12-final-definitions.md.
service: {band: midday, min_stop_departures: 1}

top_segments: {min_length_m: 100}

# Thresholds used only by the M0 inventory scripts (scripts/m0_*.py), not by the metrics.
inventory:
  hour_covered_min_share: 0.01       # a local hour counts as recorded if it holds >= 1% of the ok rows (approximation of the band rule)
  min_obs_for_speed: 500             # smaller groups get no speed in the area-effect report

day_gate:
  min_crossing_rate: 0.60            # 15 cities on 2026-09-24: 0.71-0.89
  min_ok_share: 0.55                 # 15 cities on 2026-09-24: 0.64-0.84
  min_plausible_service_date: 0.90
  min_band_recorded_share: 0.90
  anomaly_min_trip_ratio: 0.70

city_gate:                           # pilot thresholds; the annual edition needs different ones
  ranked:   {min_valid_days: 40, min_network_coverage: 0.60}
  limited:  {min_valid_days: 20, min_network_coverage: 0.40}

mode_min: {routes: 3, segments: 50}

# M3 (docs/03 §7, §6). Anomalous-day detection is independent of config/calendars (school breaks are
# deliberately empty there). mad_scale 1.0 = the literal "3 MAD" of the spec (raw MAD, ~2 sigma for
# normal data); 1.4826 would make it ~3 sigma. Owner decision pending, see docs/progress.md (M3).
anomaly:
  mad_k: 3.0
  mad_scale: 1.0
  min_days_for_mad: 5                # fewer surviving days: MAD criterion is skipped, not applied

# docs/03 §6 [PROPOSAL]: bootstrap over days, 200 draws, 90% interval; cities whose intervals
# overlap in a ranking are marked indistinguishable.
bootstrap: {n_resamples: 200, interval: 0.90, seed: 20260929}

# Dimension status (docs/03 §6: "status wymiaru wynika z jego n i progów") [PROPOSAL, not calibrated]:
# a dimension is at most `limited` when its n is below the floor, whatever the city status.
dimension_gate:
  min_obs: {speed: 1000, peak_penalty: 1000, punctuality: 1000, regularity: 200, service: 0}
  min_days: {service: 1}             # W12 has no observations, only days with a static
