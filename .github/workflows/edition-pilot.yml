name: Edition (ingest -> L1 -> day stats -> gate)

# Manual only (workflow_dispatch). Moves the slow, memory-bound steps off the author's machine:
# per city `ti ingest` + `ti aggregate` + `ti daystats` (stateless runner: the whole window is
# re-downloaded each run), then one `ti gate` job that writes ranking/quality/manifest/summary.
# Output is a workflow artifact `edition-<edition>` (data/ is never versioned, CLAUDE.md).
# NOT here: `ti geometry` (tiles, needs ~8 GB of statics) and `ti metrics` stay local.
# Runner caveat: 7 GB RAM; Warszawa's daystats peaked at ~4-5 GB locally.

on:
  workflow_dispatch:
    inputs:
      start: {description: "window start, YYYY-MM-DD", default: "2026-09-01"}
      end: {description: "window end, YYYY-MM-DD", required: true}
      cities: {description: "space-separated city ids; empty = all candidate cities", default: ""}
      edition: {description: "edition id", default: "2026-pilot"}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cities: ${{ steps.c.outputs.cities }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e ".[dev]"
      - run: pytest tests -q -m "not network"
      - id: c
        env: {CITIES: "${{ inputs.cities }}"}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from ti.config import candidate_cities
          c = os.environ["CITIES"].split() or candidate_cities()
          print("cities=" + json.dumps(c))
          EOF

  city:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        city: ${{ fromJSON(needs.plan.outputs.cities) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e .
      - name: Ingest (release assets -> L0)
        run: |
          n=$(wc -l < reports/m1/ingest_report.jsonl)
          ti ingest --from "${{ inputs.start }}" --to "${{ inputs.end }}" --cities "${{ matrix.city }}"
          mkdir -p data/editions/_frag
          tail -n +$((n+1)) reports/m1/ingest_report.jsonl > "data/editions/_frag/${{ matrix.city }}.jsonl"
      - name: L1
        run: ti aggregate --city "${{ matrix.city }}" --from "${{ inputs.start }}" --to "${{ inputs.end }}" --edition "${{ inputs.edition }}"
      - name: Day statistics
        run: ti daystats --city "${{ matrix.city }}" --from "${{ inputs.start }}" --to "${{ inputs.end }}" --edition "${{ inputs.edition }}"
      - name: Memory / disk (for the next run's planning)
        if: always()
        run: free -m; df -h . | tail -1; du -sh data/obs data/static 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: city-${{ matrix.city }}
          path: |
            data/editions/${{ inputs.edition }}/${{ matrix.city }}/day_stats.parquet
            data/editions/${{ inputs.edition }}/${{ matrix.city }}/segment_stats.parquet
            data/editions/${{ inputs.edition }}/${{ matrix.city }}/segments.parquet
            data/editions/_frag/${{ matrix.city }}.jsonl
          retention-days: 14

  gate:
    needs: city
    if: ${{ !cancelled() && needs.city.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: pyproject.toml}
      - run: pip install -e .
      - uses: actions/download-artifact@v4
        with: {pattern: "city-*", path: _in}
      - name: Assemble inputs
        run: |
          # artifacts keep paths relative to the repo root's common ancestor; flatten by city
          for d in _in/city-*; do
            c=${d#_in/city-}
            f=$(find "$d" -name "$c.jsonl"); [ -n "$f" ] && cat "$f" >> reports/m1/ingest_report.jsonl
            mkdir -p "data/editions/${{ inputs.edition }}/$c"
            find "$d" -name '*.parquet' -exec cp {} "data/editions/${{ inputs.edition }}/$c/" \;
          done
      - name: Gate and edition files
        run: |
          ti gate --from "${{ inputs.start }}" --to "${{ inputs.end }}" --edition "${{ inputs.edition }}" | tee gate.txt
          { echo '### Gate'; echo '```'; cat gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: edition-${{ inputs.edition }}
          path: |
            data/editions/${{ inputs.edition }}/*.json
            data/editions/${{ inputs.edition }}/*/summary.json
            data/editions/${{ inputs.edition }}/*/hourly.json
            data/editions/${{ inputs.edition }}/*/lines.csv
            data/editions/${{ inputs.edition }}/*/*.parquet
            gate.txt
          retention-days: 30
